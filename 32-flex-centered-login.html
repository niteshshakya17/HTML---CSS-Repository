<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centred Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            padding: 15px;
        }

        /* Login Form */

        .login {
            width: 100%;
            max-width: 380px;
            background-color: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px gray;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login h1 {
            margin: 0;
            text-align: center;
        }

        /* Input Fields */

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-weight: bold;
        }

        .field input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .field input:focus {
            outline: 2px solid #c3b5ff;
            border-color: #764ba2;
        }

        /* Remember Me and Forgot Password */

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .row a {
            color: #764ba2;
        }

        /* Login Button */

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #764ba2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #5d3a85;
        }
    </style>
</head>

<body>

    <form class="login" action="#" method="post">

        <h1>Welcome Back</h1>

        <label class="field">
            Email
            <input type="email" placeholder="you@example.com" required>
        </label>

        <label class="field">
            Password
            <input type="password" required minlength="8">
        </label>

        <div class="row">
            <label>
                <input type="checkbox">
                Remember me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Log In</button>

    </form>

</body>
</html>
