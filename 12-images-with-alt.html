<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images with Alt Text - Nitesh Kumar Shakya</title>
</head>
<body>

    <header>
        <h1>Working with Images and Alt Text</h1>
        <p>Lab Assignment by Nitesh Kumar Shakya</p>
    </header>

    <main>
        <!-- Section 1: Informative Images with Figures -->
        <section>
            <h2>Informative Images</h2>
            
            <figure>
                <img src="https://picsum.photos" width="400" height="250" alt="Screenshot of the resume website showing a name header and skills list">
                <figcaption>Resume website</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos" width="400" height="250" alt="Screenshot of the student registration form with name, email and course fields">
                <figcaption>Registration form</figcaption>
            </figure>
        </section>

        <!-- Section 2: Decorative Images (Empty Alt) -->
        <section>
            <h2>Decorative Image</h2>
            <!-- Purely decorative images get an EMPTY alt so screen readers skip them -->
            <img src="https://picsum.photos" width="600" height="80" alt="">
        </section>

        <!-- Section 3: Linked Image with Nitesh's GitHub -->
        <section>
            <h2>Linked Image</h2>
            <a href="https://github.com" target="_blank">
                <img src="https://picsum.photos" width="60" height="60" alt="Visit my GitHub profile">
            </a>
        </section>
    </main>

    <!-- 
    ALT TEXT CHECKLIST Followed:
    - Describe what the image shows and why it matters.
    - Don't start with "image of..." 
    - Linked images: describe the link destination.
    - Decorative images: alt="".
    -->

</body>
</html>
