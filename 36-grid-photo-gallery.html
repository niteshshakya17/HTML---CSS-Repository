<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 180px;
            gap: 10px;
            max-width: 1100px;
            margin: auto;
        }

        .gallery figure {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        /* Hover Effect */
        .gallery figure:hover img {
            transform: scale(1.08);
        }

        /* Image Caption */
        figcaption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            font-size: 14px;
        }

        /* Image Sizes */
        .wide {
            grid-column: span 2;
        }

        .tall {
            grid-row: span 2;
        }

        .big {
            grid-column: span 2;
            grid-row: span 2;
        }

        /* Tablet Screen */
        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile Screen */
        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .wide,
            .big {
                grid-column: auto;
            }

            .tall {
                grid-row: auto;
            }
        }
    </style>
</head>

<body>

    <h1>My Gallery</h1>

    <div class="gallery">

        <figure class="big">
            <img src="https://picsum.photos/id/1015/800/800"
                 alt="River valley">
            <figcaption>River Valley</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1016/400/400"
                 alt="Canyon">
            <figcaption>Canyon</figcaption>
        </figure>

        <figure class="tall">
            <img src="https://picsum.photos/id/1018/400/800"
                 alt="Mountain peak">
            <figcaption>Mountain Peak</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1019/400/400"
                 alt="Wooden jetty">
            <figcaption>Jetty</figcaption>
        </figure>

        <figure class="wide">
            <img src="https://picsum.photos/id/1036/800/400"
                 alt="Winter forest">
            <figcaption>Winter Forest</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1039/400/400"
                 alt="Waterfall">
            <figcaption>Waterfall</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1043/400/400"
                 alt="Evening sky">
            <figcaption>Evening Sky</figcaption>
        </figure>

    </div>

</body>
</html>
