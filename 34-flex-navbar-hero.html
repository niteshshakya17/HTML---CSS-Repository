<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar and Hero Section</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #1b263b;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background-color: white;
            box-shadow: 0 2px 8px #ddd;
            position: relative;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0077b6;
        }

        .links {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
        }

        .links a {
            text-decoration: none;
            color: #1b263b;
        }

        .links .cta {
            background-color: #0077b6;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
        }

        #toggle,
        .burger {
            display: none;
        }

        /* Hero Section */
        .hero {
            max-width: 1100px;
            margin: auto;
            padding: 60px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero-text p {
            color: #4a5568;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 22px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .primary {
            background-color: #0077b6;
            color: white;
        }

        .ghost {
            border: 2px solid #0077b6;
            color: #0077b6;
        }

        .hero-image {
            flex: 1;
        }

        .hero-image img {
            width: 100%;
            display: block;
            border-radius: 16px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .burger {
                display: block;
                font-size: 28px;
                cursor: pointer;
            }

            .links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                flex-direction: column;
                background-color: white;
                padding: 20px;
            }

            #toggle:checked ~ .links {
                display: flex;
            }

            .hero {
                flex-direction: column-reverse;
                text-align: center;
                padding: 30px 15px;
            }

            .buttons {
                justify-content: center;
            }

            .hero-text p {
                margin-left: auto;
                margin-right: auto;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <span class="logo">CloudNine</span>

        <input type="checkbox" id="toggle">
        <label for="toggle" class="burger">☰</label>

        <ul class="links">
            <li><a href="#">Features</a></li>
            <li><a href="#">Pricing</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#" class="cta">Get Started</a></li>
        </ul>

    </nav>

    <!-- Hero Section -->
    <header class="hero">

        <div class="hero-text">
            <h1>Build faster with the cloud you can trust.</h1>

            <p>
                Deploy, scale and monitor your apps in minutes
                — no servers to manage.
            </p>

            <div class="buttons">
                <a href="#" class="btn primary">Start Free</a>
                <a href="#" class="btn ghost">Watch Demo</a>
            </div>
        </div>

        <div class="hero-image">
            <img src="https://picsum.photos/id/180/700/500"
                 alt="Laptop showing a dashboard">
        </div>

    </header>

</body>
</html>
